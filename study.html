<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习专区 - 个人主页</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {font-family: "Microsoft Yahei", sans-serif; line-height: 1.8; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px;}
    header {margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #eee;}
    a {color: #2196F3; text-decoration: none;}
    a:hover {text-decoration: underline;}
    .category {margin: 25px 0;}
    h2 {margin: 15px 0; color: #222;}
    ul {padding-left: 25px; margin: 10px 0;}
    li {margin: 8px 0;}
    .back {margin: 20px 0; display: inline-block; padding: 6px 12px; background: #f0f4f9; border-radius: 4px;}
  </style>
</head>
<body>
  <header>
    <h1>📚 个人学习内容汇总</h1>
    <p>记录学习过程、知识点、教程与资料</p>
  </header>

  <!-- 返回首页 -->
  <a href="/" class="back">← 返回首页</a>

  <!-- 分类内容 -->
  <div class="category">
    <h2>一、前端技术学习</h2>
    <ul>
      <li>HTML 基础与语义化标签</li>
      <li>CSS 选择器、布局、响应式开发</li>
      <li>JavaScript 基础、函数、DOM、事件</li>
      <li>框架学习：Vue 入门实战</li>
    </ul>
  </div>

  <div class="category">
    <h2>二、编程基础</h2>
    <ul>
      <li>编程语言基础语法</li>
      <li>数组、对象、循环等常用知识点</li>
      <li>基础算法与编程练习题</li>
    </ul>
  </div>

  <div class="category">
    <h2>三、学习笔记 & 总结</h2>
    <ul>
      <li>每周学习复盘</li>
      <li>难点、易错知识点整理</li>
      <li>实战项目经验总结</li>
    </ul>
  </div>

  <div class="category">
    <h2>四、优质学习资源</h2>
    <ul>
      <li>在线学习平台</li>
      <li>免费文档、视频教程</li>
      <li>开发工具、插件推荐</li>
    </ul>
  </div>

</body>
</html>
